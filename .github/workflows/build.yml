name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-ubuntu:
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build for Ubuntu 20.04 (${{ matrix.arch }})
        run: docker/build/Ubuntu/build.sh 20.04 "${{ matrix.arch }}" dist

      - uses: actions/upload-artifact@v4
        with:
          name: lyxbosa-ubuntu2004-${{ matrix.arch }}
          path: dist/lyxbosa-ubuntu*

  build-el:
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Build for EL 8 (${{ matrix.arch }})
        run: docker/build/EL/build.sh 8 "${{ matrix.arch }}" dist

      - uses: actions/upload-artifact@v4
        with:
          name: lyxbosa-el8-${{ matrix.arch }}
          path: dist/lyxbosa-el*

  build-windows:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      - name: Set up vcpkg cache
        uses: actions/cache@v4
        with:
          path: C:\vcpkg-cache
          key: vcpkg-windows-static-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-windows-static-

      - name: Create binary cache dir
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE

      - name: Build
        run: docker/build/Windows/build.ps1 dist
        env:
          VCPKG_ROOT: C:\vcpkg

      - uses: actions/upload-artifact@v4
        with:
          name: lyxbosa-windows
          path: dist/lyxbosa-windows-*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-ubuntu, build-el, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
