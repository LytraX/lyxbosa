name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build for Linux (${{ matrix.arch }})
        run: docker/build/Linux/build.sh "${{ matrix.arch }}" dist "${{ steps.version.outputs.value }}"

      - uses: actions/upload-artifact@v4
        with:
          name: lyxbosa-linux-${{ matrix.arch }}
          path: dist/lyxbosa-linux-*

  build-windows:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up vcpkg cache
        uses: actions/cache@v4
        with:
          path: C:\vcpkg-cache
          key: vcpkg-windows-static-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-windows-static-

      - name: Create binary cache dir
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE

      - name: Build
        run: docker/build/Windows/build.ps1 dist
        env:
          VCPKG_ROOT: C:\vcpkg
          LYXBOSA_VERSION: ${{ steps.version.outputs.value }}

      - uses: actions/upload-artifact@v4
        with:
          name: lyxbosa-windows
          path: dist/lyxbosa-windows-*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Must run before download-artifact: checkout cleans the workspace
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history + tags, needed to diff against the previous tag

      - name: Build commit list
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            echo "## Commits"
            echo
            if [ -n "${previous}" ]; then
              echo "Since [\`${previous}\`](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${previous}):"
              echo
              git log --no-merges --pretty='* %s (%h)' "${previous}..${GITHUB_REF_NAME}"
            else
              git log --no-merges --pretty='* %s (%h)' "${GITHUB_REF_NAME}"
            fi
          } > NOTES.md
          cat NOTES.md

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: NOTES.md
          generate_release_notes: true
