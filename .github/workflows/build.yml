name: Build

on:
  push:
    tags:
      - 'v*'
    # Not for artefacts - the build jobs skip here - but because a cache saved during a
    # pull request is scoped to that pull request and invisible to the next one. Only the
    # default branch's caches are shared. Without a run on master, every pull request
    # starts cold no matter how well the keys are chosen, so the test jobs run here to
    # leave a cache the next pull request can restore.
    branches:
      - master
  # Pull requests run the two test jobs and nothing else: the build jobs are gated on the
  # event below, and `release` on the tag. Tags and manual runs run all five.
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------- tests
  #
  # These two jobs are the only place the test suite runs anywhere but on somebody's
  # desk. They build with BUILD_TESTS=ON and run ctest; the build jobs below build with
  # the tests OFF, because a release should compile only what it ships - and that is
  # exactly why a test target that could not compile on Windows shipped release after
  # release with every build green. The two are deliberately separate configures, so
  # a test-only switch can never leak into what is published; see the header of
  # docker/build/Linux/test-inside.sh and docker/build/Windows/test.ps1.
  #
  # What they share with the build jobs is everything that costs time: the same
  # container, compiler, triplets, static runtime and - keyed identically - the same
  # vcpkg binary cache. A pull request that warms the cache warms it for the tag.
  test-linux:
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      # A key of this job's OWN, not build-linux's, because actions/cache saves nothing
      # when the PRIMARY key hit and sharing a key means it always hits.
      #
      # What that costs is not obvious until a rebuild happens. vcpkg's binary cache is
      # keyed by an ABI hash that includes the compiler, so when GitHub rolls the runner
      # image to a new toolset every entry is invalidated and every package is rebuilt.
      # That is unavoidable and it is fine - it should be paid once. Sharing the key made
      # it recur: the rebuild could never be saved, so the next run on that image paid it
      # again, and the one after that. Falling back to the release prefix keeps the thrift
      # that is real, a cold cache still starting from what the release build had.
      - name: Restore vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: .vcpkg-cache
          key: vcpkg-linux-tests-${{ matrix.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'docker/build/Linux/Dockerfile') }}
          restore-keys: |
            vcpkg-linux-tests-${{ matrix.arch }}-
            vcpkg-linux-${{ matrix.arch }}-

      # Runs inside the release container, as an unprivileged user so the cases about
      # unreadable files and directories are observed rather than skipped as root.
      - name: Build with tests and run them (${{ matrix.arch }})
        env:
          VCPKG_BINARY_CACHE: .vcpkg-cache
        run: docker/build/Linux/test.sh "${{ matrix.arch }}"

      - name: Reclaim cache ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .vcpkg-cache || true

  test-windows:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-cache
    steps:
      - uses: actions/checkout@v5

      # This job's own key, falling back to the release one. See the note in test-linux.
      # Measured here: a run that landed on runner image 20260907.229 rebuilt all ten
      # packages and took 11m34s, then logged "Cache hit occurred on the primary key, not
      # saving cache" and threw the lot away. The next run, on 20260824.214, rebuilt
      # nothing and took 4m56s - and would have paid the same 11m34s again the moment it
      # met the newer image.
      - name: Set up vcpkg cache
        uses: actions/cache@v5
        with:
          path: C:\vcpkg-cache
          key: vcpkg-windows-tests-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-windows-tests-
            vcpkg-windows-static-

      - name: Create binary cache dir
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE

      # x64 only: the runner cannot execute an arm64 test binary, and compiling one it
      # never runs is the half of the check that proves least.
      - name: Build with tests and run them
        run: docker/build/Windows/test.ps1
        env:
          VCPKG_ROOT: C:\vcpkg

  # ---------------------------------------------------------------- release binaries
  build-linux:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      - name: Extract version from tag
        id: version
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # vcpkg builds every dependency from source, which is most of this job. The
      # cache is keyed on what actually determines the binaries: the dependency
      # list, the pinned registry baseline in vcpkg-configuration.json, and the
      # Dockerfile (compiler and toolchain). A miss on any of those rebuilds.
      #
      # Restoring a stale or partial cache is safe: vcpkg keys each entry by an ABI
      # hash covering the port version, triplet, compiler and dependency hashes, so
      # an entry that does not apply is ignored rather than reused.
      - name: Restore vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: .vcpkg-cache
          key: vcpkg-linux-${{ matrix.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'docker/build/Linux/Dockerfile') }}
          restore-keys: |
            vcpkg-linux-${{ matrix.arch }}-

      - name: Build for Linux (${{ matrix.arch }})
        env:
          VCPKG_BINARY_CACHE: .vcpkg-cache
        run: docker/build/Linux/build.sh "${{ matrix.arch }}" dist "${{ steps.version.outputs.value }}"

      # The container writes the cache as root; hand it back so actions/cache can
      # read it when it saves at the end of the job.
      - name: Reclaim cache ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .vcpkg-cache || true

      - uses: actions/upload-artifact@v6
        with:
          name: lyxbosa-linux-${{ matrix.arch }}
          path: dist/lyxbosa-linux-*

  build-windows:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_BINARY_CACHE: C:\vcpkg-cache
    steps:
      - uses: actions/checkout@v5

      - name: Extract version from tag
        id: version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set up vcpkg cache
        uses: actions/cache@v5
        with:
          path: C:\vcpkg-cache
          key: vcpkg-windows-static-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-windows-static-

      - name: Create binary cache dir
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE

      - name: Build
        run: docker/build/Windows/build.ps1 dist
        env:
          VCPKG_ROOT: C:\vcpkg
          LYXBOSA_VERSION: ${{ steps.version.outputs.value }}

      - uses: actions/upload-artifact@v6
        with:
          name: lyxbosa-windows
          path: dist/lyxbosa-windows-*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Must run before download-artifact: checkout cleans the workspace
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history + tags, needed to diff against the previous tag

      # Release notes are the changelog entry for this version, then the commit
      # list. The changelog carries what a commit subject cannot - what a scan
      # reports differently on the same input, and what a caller has to change -
      # so it goes first and the commits become the detail below it.
      #
      # A tag with no changelog entry still releases, with the commit list alone.
      # Failing a release over a missing section would be the wrong trade.
      - name: Build release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # --match 'v*' because the corpus has its own tag series, corpus-YYYY.MM.N, on a
          # different cadence. Without it the newest tag of EITHER series wins: from HEAD
          # today an unfiltered describe returns corpus-2026.09.1, so the next scanner
          # release would have announced "Since corpus-2026.09.1" and listed a commit range
          # starting at a corpus review round. Scanner releases are v-tags; ask only about
          # those. See docs/RELEASING.md and corpus/CHANGELOG.md for the two series.
          previous=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)

          # Everything under "## [1.2.0]" (or "## 1.2.0") up to the next "## ".
          # Dots in the version are escaped so 2.1.0 cannot match 2x1y0, and the
          # trailing separator and link-reference block that follow the last
          # section in the file are trimmed off the end.
          awk -v ver="${version}" '
            BEGIN {
              esc = ver; gsub(/\./, "\\.", esc)
              head = "^## \\[?" esc "\\]?([^0-9]|$)"
            }
            /^## / { if (inside) exit; if ($0 ~ head) inside = 1; next }
            inside { body = body $0 "\n" }
            END {
              n = split(body, line, "\n")
              while (n > 0 && (line[n] == "" || line[n] == "---" || line[n] ~ /^\[[^]]+\]: /)) n--
              first = 1
              while (first <= n && line[first] == "") first++
              for (i = first; i <= n; i++) print line[i]
            }
          ' CHANGELOG.md > CHANGES.md || true

          if [ -s CHANGES.md ]; then
            echo "Changelog section found for ${version} ($(wc -l < CHANGES.md) lines)"
          else
            echo "No changelog section for ${version}; releasing with the commit list only"
          fi

          {
            if [ -s CHANGES.md ]; then
              cat CHANGES.md
              echo
              echo "---"
              echo
            fi
            echo "## Commits"
            echo
            if [ -n "${previous}" ]; then
              echo "Since [\`${previous}\`](https://github.com/${GITHUB_REPOSITORY}/releases/tag/${previous}):"
              echo
              git log --no-merges --pretty='* %s (%h)' "${previous}..${GITHUB_REF_NAME}"
            else
              git log --no-merges --pretty='* %s (%h)' "${GITHUB_REF_NAME}"
            fi
          } > NOTES.md
          cat NOTES.md

      - uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      # minisign comes from the distribution rather than a downloaded binary: a release job
      # that fetches an unverified executable to verify things with has an obvious hole in
      # the middle of it.
      - name: Install minisign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends minisign
          minisign -v

      # The controls first, and on the runner rather than only on a laptop. Everything below
      # runs exactly once per release, on a tag, against a real publish that cannot be
      # rehearsed - see the header of either script. This step is what makes the checks in
      # them checks: it plants each failure, asserts it is caught, and takes about a second.
      - name: Prove the release-integrity checks can fail
        run: |
          .github/scripts/release-checksums.sh --selftest
          .github/scripts/release-sign.sh --selftest --require-minisign

      # --expect 4 is the four binaries the two build jobs publish: linux amd64 and arm64,
      # windows amd64 and arm64. It is exact on purpose. A list that is missing one binary
      # looks finished, and a release that gained an asset should stop here and be looked at
      # rather than shipping a checksum file that quietly does not cover it.
      - name: Checksum every asset
        run: .github/scripts/release-checksums.sh write artifacts --expect 4

      # A checksum file published beside the files it describes is only a defence against a
      # corrupted download - whoever can write to the release can rewrite the list too. This
      # is the step that makes it worth reading, and it FAILS rather than degrading to an
      # unsigned release: the release step below never runs if this one exits non-zero, and
      # that ordering is the guarantee. Do not move it, and do not add `continue-on-error`.
      - name: Sign SHA256SUMS
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_KEY_PASSWORD: ${{ secrets.MINISIGN_KEY_PASSWORD }}
        run: .github/scripts/release-sign.sh sign artifacts

      # `files: artifacts/*` needs no change to pick the two new files up: measured against
      # glob 13.0.6, the version softprops/action-gh-release@v3 pins, the pattern resolves to
      # six paths including artifacts/SHA256SUMS and artifacts/SHA256SUMS.minisig.
      #
      # fail_on_unmatched_files is the same argument as --expect above, one level out: a
      # release that attaches nothing is a release that looks published.
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          body_path: NOTES.md
          generate_release_notes: true
